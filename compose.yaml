services:
  nocobase:
    image: nocobase/nocobase:2.1.31
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      APP_KEY: ${APP_KEY:?請先設定 APP_KEY}
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: motion
      DB_USER: motion
      DB_PASSWORD: ${POSTGRES_PASSWORD:?請先設定資料庫密碼}
      TZ: Asia/Taipei
    ports:
      - "0.0.0.0:13003:80"
    volumes:
      - motion_nocobase_storage:/app/nocobase/storage

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: motion
      POSTGRES_USER: motion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請先設定資料庫密碼}
      TZ: Asia/Taipei
    volumes:
      - motion_postgres_data:/var/lib/postgresql/data

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.20.7
    restart: unless-stopped
    environment:
      TZ: Asia/Taipei
      GENERIC_TIMEZONE: Asia/Taipei
    ports:
      - "127.0.0.1:5684:5678"
    volumes:
      - motion_n8n_data:/home/node/.n8n

volumes:
  motion_nocobase_storage:
  motion_postgres_data:
  motion_n8n_data: